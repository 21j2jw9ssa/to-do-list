<!DOCTYPE html>

<html lang="en">
  <head>
	<title>To-do List</title>
	<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="todolist-style.css">
  </head>
  <body>
	<h1 id="mainTitle">To-do List</h1>
    <div id="nav_of_links">
      <a href="">Home</a>
      <a href="../help/todolist-help.html" title="how to use MakeList">Help</a>
      <a href="../about/todolist-about-me.html" title="about me">About</a>
    </div>
	<!-- NAVIGATION BAR -->
	<script src="../nav.js"></script>
	<div id="input_wrapper">
	  <input type="text" id="inputItem" placeholder="enter new item">
	  <button id="addItem" class="listFunc" >add item</button>
	</div>
	<!-- FUNCTIONS OF TO-DO LIST -->
	<div class="btn_container">
	  <button id="clearBuffer" class="listFunc" >clear the list buffer</button>
	  <button id="saveFile" class="listFunc" >save list</button>
	  <button id="exportFile" class="listFunc" >export list</button>
	  <button id="loadFile" class="listFunc" >load list</button>
	  <button id="importFile" class="listFunc" >import list</button>
	  <button id="clearFile" class="listFunc" >delete the saved list</button>
	</div>

	<div class="custom-select">
	  order by:
      <select id="dropdown_list" disabled>
        <option value="">select ordering</option> <!-- DEFAULT -->
        <option value="magnitude_asc">smallest to largest</option>
        <option value="magnitude_desc">largest to smallest</option>
        <option value="checkbox_status_asc">latest done to earliest done</option>
        <option value="checkbox_status_desc">earliest done to latest done</option>
      </select>
    </div>

	<!-- LIST BUFFER -->
	<ul id="buffer"></ul>
	<section>
	  <a href="#mainTitle" id="nav_to_top">to the top</a>
    </section>
    <br>
	<!-- MODULES -->
	<script src="https://raw.githack.com/SortableJS/Sortable/master/Sortable.js"></script>   <!-- MODULE FOR DRAGGABLE LIST ITEMS -->
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>                      <!-- SWEETALERT2 -->
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>  <!-- DOM PURIFICATION MODULE -->
	<!-- MY CODE -->
	<script src="todolist-list-manager.js"></script>                                         <!-- LIST MANAGER MODULE -->
	<script src="todolist-file-handling.js"></script>                                        <!-- FILE IMPORT/EXPORT -->
    <script src="todolist-list-item-draggable.js"></script>                                  <!-- DRAGGABLE LIST ITEMS -->
	<script src="todolist-mechanism.js"></script>                                            <!-- BUTTON LISTENERS -->
	<footer>All contents is made by myself.<br>All rights reserved.</footer>
  </body>
</html>

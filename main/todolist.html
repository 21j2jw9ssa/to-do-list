<html lang="en">
	<head>
		<title>To-do List</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="todolist-style.css">

		<!-- Google icons: rounded -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

		<!-- Custom ICON on different devices/browsers -->
		<link rel="icon" type="image/png" href="../icons/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="../icons/favicon/favicon.svg" />
		<link rel="shortcut icon" href="../icons/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="../icons/favicon/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="MakeList" />
		<link rel="manifest" href="../icons/favicon/site.webmanifest" />

	</head>
	<body>
		<div id="header-wrapper">
			<h1 id="mainTitle">To-do List</h1>
  		<div id="nav-of-links">
    		<a href="" title="return to homepage">Home</a>
    		<a href="../help/todolist-help.html" title="how to use MakeList">Help</a>
    		<a href="../about/todolist-about-me.html" title="about me">About</a>
  		</div>
		</div>
		<div id="input-wrapper">
			<input type="text" id="inputItem" placeholder="enter new item">
			<button id="addItem" title="add item" class="listFunc">add item</button>
		</div>
		<div class="btn-container">
			<button id="exportFile" title="export list" class="listFunc">export list</button>
			<button id="importFile" title="import list" class="listFunc">import list</button>
			<button id="deleteList" title="delete list" class="listFunc">delete list</button>
		</div>
		<div class="dropdown custom-select" title="sort items">
			ordering items from
			<div class="dropdown">
				<button class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">
				</button>
				<ul class="dropdown-menu" role="listbox">
					<li role="option" data-mode="magnitude-asc">
						📝⬆️ smallest to largest
					</li>
					<li role="option" data-mode="magnitude-desc">
						📝⬇️ largest to smallest
					</li>
					<li role="option" data-mode="checkbox-status-asc">
						✔️⬆️ latest done to earliest done
					</li>
					<li role="option" data-mode="checkbox-status-desc">
						✔️⬇️ earliest done to latest done
					</li>
                    <!-- 					
					<li role="option" data-mode="deadline-asc">
						📅⬆️ closest to farthest
					</li>
					<li role="option" data-mode="deadline-desc">
						📅⬇️ farthest to closest
					</li>
					<li role="option" data-mode="priority-asc">
						⌚⬆️ low to high
					</li>
					<li role="option" data-mode="priority-desc">
						⌚⬇️ high to low
					</li>
					 -->
				</ul>
			</div>
		</div>

		<!-- LIST BUFFER -->
		<div id="buffer"></div>
		<button id="backToTop">⬆ back to the top</button>

		<!-- MODULES -->
		<script src="https://raw.githack.com/SortableJS/Sortable/master/Sortable.js"></script> 	<!-- MODULE FOR DRAGGABLE LIST ITEMS -->
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>                  		<!-- SWEETALERT2 -->
		<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>	<!-- DOM PURIFICATION MODULE -->

		<!-- MY CODE -->
		<script src="../nav.js"></script>                                                    		<!-- NAVIGATION BAR -->
		<script src="todolist-list-manager.js"></script>                                     		<!-- LIST MANAGER MODULE -->
		<script src="todolist-file-handling.js"></script>                                    		<!-- FILE IMPORT/EXPORT -->
		<script src="todolist-list-item-draggable.js"></script>                              		<!-- DRAGGABLE LIST ITEMS -->
		<script src="todolist-mechanism.js"></script>                                        		<!-- BUTTON LISTENERS -->
		<script src="sort-dropdown.js"></script>                                          		<!-- DROPDOWN -->
		<script src="../back-to-top.js"></script>                                                   <!-- BACK-TO-TOP BUTTON -->

		<footer>
			All contents is made by myself.<br>All rights reserved.
		</footer>
	</body>
</html>

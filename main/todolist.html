  </head>
  <body>
	<h1 id="mainTitle">To-do List</h1>
    <div id="nav_of_links">
      <a href="">Home</a>
      <a href="../help/todolist-help.html" title="how to use MakeList">Help</a>

	<script src="../nav.js"></script>
	<input type="text" id="inputItem" placeholder="enter a name for the new item"/>
	<!-- Functions of To-do List -->
	<button id="addItem" class="listFunc" >add an item</button>
	<button id="saveFile" class="listFunc" >save as a file</button>
	<button id="sortItems" class="listFunc" >sort items</button>
	<button id="loadFile" class="listFunc" >load file</button>
	<button id="clearBuffer" class="listFunc" >clear list</button>
	<button id="clearFile" class="listFunc" >delete file</button>
	<button id="exportFile" class="listFunc" >export list</button>
	<button id="importFile" class="listFunc" >import file</button>
	<ul id="buffer"></ul>
	<section>
	  <a href="#mainTitle" id="nav_to_top">to the top</a>
    </section>
